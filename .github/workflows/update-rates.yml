name: Update Rates Daily
permissions:
  contents: write

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 6:00 AM MDT
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Update rates JSON
        run: npm run update-rates

      - name: Commit updated rates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/rates-data.json public/rates-data.json src/data/rates-history.json public/rates-history.json src/data/update-log.txt
          git commit -m "chore: daily rates update" || echo 'No changes to commit'

      - name: Push updated rates to main
        run: |
          git push origin HEAD:main

      # Verificación: si el build rompe, el job falla y nos enteramos.
      # El despliegue lo hace Vercel automáticamente con el push a main.
      - name: Build Astro (verificación)
        run: npm run build
